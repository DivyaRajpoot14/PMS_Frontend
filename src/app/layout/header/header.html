<header class="w-full bg-white shadow-md px-6 py-3 flex items-center justify-between">
  
  <!-- Left: Project Name -->
  <div class="text-xl font-bold text-indigo-600">
    MyProject
  </div>

  <!-- Right: Actions -->
  <div class="flex items-center space-x-5">
    
    <!-- Notification Icon -->
    <button class="relative">
      <svg xmlns="http://www.w3.org/2000/svg" 
           class="h-6 w-6 text-gray-600 hover:text-indigo-600 transition"
           fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11
             a6.002 6.002 0 00-4-5.659V5
             a2 2 0 10-4 0v.341C7.67 6.165
             6 8.388 6 11v3.159c0 .538-.214
             1.055-.595 1.436L4 17h5m6 0v1
             a3 3 0 11-6 0v-1m6 0H9"/>
      </svg>
      <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full px-1">
        3
      </span>
    </button>

    <!-- Profile Icon -->
    <button>
      <svg xmlns="http://www.w3.org/2000/svg"
           class="h-7 w-7 text-gray-600 hover:text-indigo-600 transition"
           fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M5.121 17.804A9 9 0 1118.879 17.804M15
             11a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
    </button>

    <button
      (click)="goSignup()"
      class="border border-indigo-600 text-indigo-600 px-4 py-2 rounded-lg hover:bg-indigo-50 transition">
      Sign Up
    </button>

    <!-- Login Button -->
    <button
      (click)="goLogin()"
      class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
      Login
    </button>

  </div>

</header>
